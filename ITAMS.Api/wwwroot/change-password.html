<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="login">

        <section class="login-sign" aria-hidden="false">
            <div class="login-carousel">
                <div class="slide slide-1 active"></div>
                <div class="slide slide-2"></div>
                <div class="slide slide-3"></div>
                <div class="slide slide-4"></div>
            </div>

            <div class="login-sign-content">
                <div class="brand">
                    <span class="mark" aria-hidden="true"></span>
                    <span class="brand-name">ITAMS</span>
                </div>

                <div class="hero-copy">
                    <h1>Change your password.</h1>
                    <p>You will be asked to sign in again with the new password.</p>
                    <ul class="chips">
                        <li>Track assets</li>
                        <li>Schedule maintenance</li>
                        <li>Audit trail</li>
                    </ul>
                </div>

                <div class="dots" aria-hidden="true">
                    <span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            </div>
        </section>

        <section class="login-form">
            <form id="pw-form" novalidate>
                <h2>New password</h2>
                <div id="error" class="alert" role="alert" hidden></div>

                <label class="field">
                    <span id="current-label">Current password</span>
                    <input id="current" type="password" autocomplete="current-password" required maxlength="200">
                </label>
                <label class="field">
                    <span>New password (at least 12 characters)</span>
                    <input id="new" type="password" autocomplete="new-password" required minlength="12" maxlength="200">
                </label>
                <label class="field">
                    <span>Repeat new password</span>
                    <input id="confirm" type="password" autocomplete="new-password" required minlength="12" maxlength="200">
                </label>

                <p class="muted">A few unrelated words strung together is easy to remember and hard to guess.</p>
                <button id="submit" class="btn btn-sign" type="submit">Save password</button>
                <button id="cancel" class="btn btn-quiet" type="button">Cancel</button>
            </form>
        </section>
    </div>

  <script type="module" src="/js/change-password.js"></script>
</body>
</html>
